name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege for the automatic GITHUB_TOKEN. Without this block the token
# inherits the repository default, which may still be read/write for all scopes;
# every job here only needs to read the checked-out code, so a compromised
# dependency or build step cannot push commits, publish packages, or edit issues.
permissions:
  contents: read

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run typecheck
      - run: bun run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build
      - run: bun test

  test-update-system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      
      - name: Install dependencies
        run: bun install
      
      - name: Build
        run: bun run build
      
      - name: Generate manifest
        run: bun run prepack
      
      - name: Build tarball for linux-x64
        run: bunx oclif pack tarballs --root=. --targets=linux-x64
      
      - name: Find tarball
        id: find-tarball
        run: |
          TARBALL=$(ls dist/*.tar.gz | head -1)
          echo "tarball=$TARBALL" >> $GITHUB_OUTPUT
          echo "Found tarball: $TARBALL"
      
      - name: Build test Docker image
        run: docker build -t ethos-local-test -f test/e2e/Dockerfile.local-test test/e2e/
      
      - name: Run update system E2E tests
        env:
          # The tarball path is derived from package.json (name/version) inside
          # the checked-out branch, which on a pull_request run is code from the
          # contributor's fork. Inline "${{ }}" interpolation is textual
          # substitution performed before bash parses this script, so a crafted
          # version string could close the quote and append shell commands.
          # Passing both values via the environment and quoting them on use
          # means bash treats them as data, never as syntax.
          WORKSPACE: ${{ github.workspace }}
          TARBALL: ${{ steps.find-tarball.outputs.tarball }}
        run: |
          docker run --rm \
            -v "$WORKSPACE/$TARBALL:/tmp/ethos-local.tar.gz:ro" \
            -v "$WORKSPACE/test/e2e/test-update-local.sh:/home/testuser/test-update-local.sh:ro" \
            ethos-local-test \
            bash /home/testuser/test-update-local.sh /tmp/ethos-local.tar.gz
